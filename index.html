<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workouts">
  <title>Workout Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar"><h1 id="title">Today</h1><div id="topAction"></div></header>
  <main id="main"></main>
  <div id="timer" class="timer hidden" role="status" aria-live="polite"></div>
  <nav class="tabs">
    <button data-tab="today"><span class="ti">●</span>Today</button>
    <button data-tab="plan"><span class="ti">▦</span>Plan</button>
    <button data-tab="history"><span class="ti">↻</span>History</button>
    <button data-tab="more"><span class="ti">⚙</span>Settings</button>
  </nav>
  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
